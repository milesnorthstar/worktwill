[package]
name = "worktwill-desktop"
version = "1.3.4"
edition = "2021"
publish = false
default-run = "worktwill-desktop"
license = "MIT"

[features]
release-tools = []

# 校验命令仅在发行工具调用时编译，不进入普通应用打包。
[[bin]]
name = "verify-release"
path = "src/bin/verify-release.rs"
required-features = ["release-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 发行前复用更新器相同的验签实现，版本沿用现有锁文件。
base64 = "0.22"
minisign-verify = "=0.3.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "=2.14.1"
worktwill-core = { path = "../crates/worktwill-core" }
serde_json = "1"
notify = "8"

uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
scraper = "0.24"
tokio = { version = "1", features = ["net", "time", "sync"] }
serde = {version="1", features= ["derive"] }
sha2 = "0.10"
semver = "1"
tempfile = "3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt"] }
