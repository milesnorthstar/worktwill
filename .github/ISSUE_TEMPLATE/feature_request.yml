name: Feature request / 功能建议
description: Describe the problem and intended outcome / 描述问题和期望结果
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 问题与使用场景
      description: What are you trying to achieve, and what is difficult today? / 希望完成什么，目前有什么困难？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome / 期望结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 已考虑的替代方式
  - type: markdown
    attributes:
      value: Suggestions are discussed before implementation; submission is not a delivery commitment. / 建议需先讨论范围，提交不代表承诺排期。
