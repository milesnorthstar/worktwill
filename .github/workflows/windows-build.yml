name: Windows installer

# 仅手动构建候选，不在推送或 PR 中使用发行密钥，也不自动发布。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Set up pinned Rust toolchain
        run: |
          # rustup 读取仓库的 rust-toolchain.toml，不另设一份版本。
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((rustc -vV | Select-String '^host:').ToString().Trim() -ne 'host: x86_64-pc-windows-msvc') {
            throw 'Expected the Windows x64 MSVC toolchain.'
          }

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: |
          # 样本仅放在当前运行的独立临时目录，不接触用户资料。
          $fixtures = Join-Path $env:RUNNER_TEMP 'worktwill-fixtures'
          New-Item -ItemType Directory -Path $fixtures -ErrorAction Stop | Out-Null
          pnpm check --fixtures $fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer and signed update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Configure the existing updater key in the TAURI_SIGNING_PRIVATE_KEY repository secret. Do not generate a new key.'
          }
          pnpm release:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Register isolated candidate
        id: artifacts
        run: |
          $bundle = 'target/release/bundle/nsis'
          $installers = @(Get-ChildItem -Path $bundle -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          pnpm release:record --target windows-x86_64 --version $version --installer $installers[0].FullName --update $installers[0].FullName --provenance "$bundle/build-provenance.json" --notes-file CHANGELOG.md --output target/release/candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "name=WorkTwill-$version-windows-x64-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
          "Candidate prepared, not published. Download the complete artifact and follow docs/RELEASING.md for Windows Agent acceptance." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifacts.outputs.name }}
          # 显式列举制品，不上传私钥目录、缓存或完整工作区。
          path: target/release/candidate/
          if-no-files-found: error
          retention-days: 14
