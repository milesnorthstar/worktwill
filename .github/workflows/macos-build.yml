name: macOS installer

# 手动构建Apple Silicon候选，不自动发布；Intel不在本工作流目标范围。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Check platform and toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run project checks
        run: |
          set -e
          mkdir "$RUNNER_TEMP/worktwill-fixtures"
          pnpm check --fixtures "$RUNNER_TEMP/worktwill-fixtures"
          pnpm test:release
      - name: Build installer and signed update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          pnpm release:build
      - name: Register isolated candidate
        run: |
          set -e
          shopt -s nullglob
          installers=(target/release/bundle/dmg/*.dmg)
          test "${#installers[@]}" = 1
          version=$(node -p "require('./package.json').version")
          pnpm release:record --target darwin-aarch64 --version "$version" --installer "${installers[0]}" --update target/release/bundle/macos/WorkTwill.app.tar.gz --provenance target/release/bundle/dmg/build-provenance.json --notes-file CHANGELOG.md --output target/release/candidate
          echo 'Candidate prepared, not published. Follow docs/RELEASING.md for native acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WorkTwill-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release/candidate/
          if-no-files-found: error
          retention-days: 14
