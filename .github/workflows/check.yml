name: Project checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        shell: pwsh
        run: |
          # 仅在当前 runner 的独立目录创建样本；PR 检查不读取发行密钥。
          $fixtures = Join-Path $env:RUNNER_TEMP 'worktwill-fixtures'
          New-Item -ItemType Directory -Path $fixtures -ErrorAction Stop | Out-Null
          pnpm check --fixtures $fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test release safety gates
        run: pnpm test:release

      - name: Test release signature verifier
        run: cargo test --locked -p worktwill-desktop --features release-tools --bin verify-release

      - name: Test website HTTP audit in isolation
        run: node --test website/scripts/audit-geo.test.mjs
