const seed={spaces:[{id:'campaign',name:'秋季内容发布',color:'#879f6b',tint:'#eef3e4',note:'内容、设计和发布入口，放在一起。',ids:['plan','schedule','poster','brief','backend','figma']},{id:'client',name:'客户 A · 品牌合作',color:'#a69c7e',tint:'#f5f1e6',note:'从合作方案到交付，不再反复找资料。',ids:['contract','brief','clientlink']},{id:'research',name:'产品灵感收集',color:'#8b9fac',tint:'#edf2f5',note:'值得回来再看的想法与参考。',ids:['research','figma','old']}],resources:[{id:'plan',name:'秋季内容发布方案.docx',kind:'DOC',path:'文档 / 品牌活动 / 秋季发布',size:'248 KB',modified:'今天 10:24'},{id:'schedule',name:'11 月内容排期.xlsx',kind:'XLS',path:'桌面 / 内容运营',size:'56 KB',modified:'今天 09:45'},{id:'poster',name:'主视觉海报_v3.png',kind:'PNG',path:'下载 / 设计交付',size:'3.2 MB',modified:'昨天 18:32'},{id:'brief',name:'品牌合作 Brief.pdf',kind:'PDF',path:'文档 / 客户资料 / 客户 A',size:'1.4 MB',modified:'昨天 16:08'},{id:'contract',name:'客户 A 合作合同.docx',kind:'DOC',path:'文档 / 客户资料 / 客户 A',size:'184 KB',modified:'11 月 16 日'},{id:'research',name:'竞品研究笔记.pdf',kind:'PDF',path:'文档 / 产品研究',size:'820 KB',modified:'11 月 15 日'},{id:'old',name:'历史参考素材.zip',kind:'ZIP',path:'外置磁盘 / 历史素材',size:'24 MB',modified:'11 月 12 日',missing:true},{id:'backend',name:'内容发布后台',kind:'WEB',url:'https://example.com/publish',modified:'手动保存'},{id:'figma',name:'品牌视觉 · Figma',kind:'WEB',url:'https://www.figma.com/',modified:'手动保存'},{id:'clientlink',name:'客户项目主页',kind:'WEB',url:'https://example.com/project',modified:'手动保存'}],last:'campaign'};
// 原型只持久化演示资料及关系，不读取、扫描或修改本地文件。
let state;try{const saved=localStorage.getItem(key);state=saved?JSON.parse(saved):structuredClone(seed)}catch{state=structuredClone(seed)}
let view='home',current=null,filter='all',selected=new Set(),detailId=null,searchIndex=-1,searchItems=[],scope='all',toastTimer,returnFocus;
const resource=id=>state.resources.find(r=>r.id===id),space=id=>state.spaces.find(w=>w.id===id),isWeb=r=>r.kind==='WEB';
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{notify('浏览器未允许本地存储，本次改动仅在当前页面保留')}}
function notify(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function fileIcon(r){const cls={DOC:'doc',PDF:'pdf',PNG:'img',WEB:'web',ZIP:'zip'}[r.kind]||'';return `<span class="file-icon ${cls}">${isWeb(r)?svg('link'):esc(r.kind)}</span>`}
function btn(label,action,icon='plus',cls='',id=''){return `<button type="button" class="button ${cls}" data-action="${action}" data-id="${esc(id)}">${svg(icon)}${esc(label)}</button>`}
function smallButton(label,action,icon,id=''){return `<button type="button" class="icon-button" title="${esc(label)}" aria-label="${esc(label)}" data-action="${action}" data-id="${esc(id)}">${svg(icon)}</button>`}
function colorStyle(w){return `--tone:${w.color};--tint:${w.tint};--dot:${w.color}`}
function nav(){const counts=state.resources.length;$('#sidebar').innerHTML=`<button class="brand" data-action="home" aria-label="Local Workspace 工作台"><span class="logo">${svg('layers')}</span><span><strong>Local Workspace</strong><small>让工作，有处继续</small></span></button><nav>${[['home','home','工作台',''],['spaces','layers','工作区',state.spaces.length],['resources','folder','全部资料',counts]].map(([id,icon,label,count])=>`<button class="nav ${view===id||view==='workspace'&&id==='spaces'?'active':''}" data-action="${id}">${svg(icon)}<span class="nav-label">${label}</span><span class="count">${count}</span></button>`).join('')}</nav><div class="side-heading">我的工作区<button data-action="new-space" aria-label="新建工作区">${svg('plus')}</button></div>${state.spaces.map(w=>`<button class="nav workspace-nav ${view==='workspace'&&current===w.id?'active':''}" data-action="workspace" data-id="${w.id}" style="${colorStyle(w)}"><span class="dot"></span><span class="nav-label">${esc(w.name)}</span></button>`).join('')}<div class="side-bottom"><button class="nav" data-action="locations">${svg('settings')}<span class="nav-label">管理位置</span></button><div class="privacy">${svg('shield')}<span>资料留在原处<br>无需账号 · 本地优先</span></div><div class="profile"><span class="avatar">LW</span><span><strong>个人工作空间</strong><small>演示数据 · 本地保存</small></span><span class="version">v0.1</span></div></div>`}
function card(w){const files=w.ids.map(resource).filter(Boolean),fileCount=files.filter(r=>!isWeb(r)).length;return `<button class="space-card" data-action="workspace" data-id="${w.id}" style="${colorStyle(w)}"><div class="card-head"><span class="space-icon">${svg('folder')}</span><span class="card-label">${w.id===state.last?'上次打开':''}</span></div><h3>${esc(w.name)}</h3><p>${fileCount} 个文件<span aria-hidden="true"> &nbsp;·&nbsp; </span>${files.length-fileCount} 个网页</p><div class="card-meta">${files.slice(0,3).map(r=>`<span class="tiny-file">${svg(isWeb(r)?'link':'file')}</span>`).join('')}<small>${files.length?'资料原地不动':'等待第一份资料'}</small></div>${svg('arrow').replace('<svg ','<svg class="card-arrow" ')}</button>`}
function footer(){return `<footer class="footer"><span>${svg('shield')}交互概念原型 · 不扫描、不打开、不修改真实文件</span><span>LOCAL FIRST. WORK IN CONTEXT.</span></footer>`}
function table(items,home=false){const filtered=items.filter(r=>filter==='all'||(filter==='file'?!isWeb(r):isWeb(r)));return `<div class="table-panel"><div class="table-toolbar"><div class="tabs">${[['all',home?'最近修改':'全部资料'],['file','文件'],['web','网页']].map(([id,label])=>`<button class="tab ${filter===id?'active':''}" data-action="filter" data-id="${id}">${label}</button>`).join('')}</div><span class="tiny-note">${home?'文件修改时间为演示样例':`${items.length} 份资料 · 原件保持原位`}</span></div>${selected.size?`<div class="selection-bar"><span>已选择 ${selected.size} 份资料</span><div class="actions">${btn('加入工作区','link-selected','plus','soft')}${view==='workspace'?btn('从本工作区移除','remove-selected','minus'):''}${smallButton('取消选择','clear-selection','close')}</div></div>`:''}${filtered.length?`<div class="table-scroll"><table><thead><tr><th style="width:35px"><input type="checkbox" aria-label="选择当前列表全部资料" id="select-all" ${filtered.every(r=>selected.has(r.id))?'checked':''}></th><th>名称</th><th>${home?'修改时间':'所在位置 / 网址'}</th><th>${home?'工作区':'类型'}</th><th></th></tr></thead><tbody>${filtered.map(r=>{const related=state.spaces.filter(w=>w.ids.includes(r.id));return `<tr><td><input type="checkbox" aria-label="选择 ${esc(r.name)}" data-select="${r.id}" ${selected.has(r.id)?'checked':''}></td><td><div class="name-cell">${fileIcon(r)}<div><button class="resource-title" data-action="detail" data-id="${r.id}">${esc(r.name)}</button><div class="resource-sub">${home?esc(r.path||new URL(r.url).hostname):esc(r.modified)}</div></div></div></td><td class="muted">${home?esc(r.modified):esc(r.url?new URL(r.url).hostname:r.path)}</td><td>${r.missing?'<span class="badge warn">原件不可用</span>':home?`<span class="badge">${esc(related[0]?.name||'未关联')}${related.length>1?` +${related.length-1}`:''}</span>`:`<span class="badge">${isWeb(r)?'网页':r.kind+' 文件'}</span>`}</td><td>${smallButton('查看资料详情','detail','chevron',r.id)}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">${svg('folder')}这里还没有${filter==='web'?'网页':filter==='file'?'文件':'资料'}<br><span class="tiny-note">添加资料，开始组织这件工作。</span></div>`}<div class="table-foot">${home?'最近修改不是全系统使用历史；当前均为演示资料。':'关联只发生在工作区内，不移动或复制源文件。'}</div></div>`}
function visibleResources(){let list=view==='workspace'?(space(current)?.ids||[]).map(resource).filter(Boolean):state.resources;return view==='home'?list.filter(r=>filter==='web'?isWeb(r):!isWeb(r)).slice(0,4):list}
function render(){nav();let w=space(current);$('#breadcrumb').innerHTML=`个人空间 ${svg('chevron')} <strong>${esc(view==='home'?'工作台':view==='spaces'?'工作区':view==='workspace'?w.name:'全部资料')}</strong>`;let html='';if(view==='home'){const last=space(state.last)||state.spaces[0];html=`<div class="eyebrow">YOUR PERSONAL WORKSPACE</div><div class="page-heading"><div><h1>把注意力，留给工作。</h1><p>文件不必搬家，思路不必重新开始。</p></div>${btn('新建工作区','new-space','plus')}</div>${last?`<section class="resume"><div class="resume-copy"><div class="eyebrow">PICK UP WHERE YOU LEFT OFF</div><h2>${esc(last.name)}</h2><p>${esc(last.note)}<br>${last.ids.length} 份相关资料，等你继续。</p><div class="actions">${btn('继续这件工作','workspace','arrow','primary',last.id)}<span class="tiny-note">原文件始终留在原处</span></div></div><div class="resume-art" aria-hidden="true"><div class="orbit"></div><div class="paper"><div class="file-icon doc">DOC</div><i></i><i></i></div><div class="paper back"><div class="mini-link">${svg('link')}</div><i></i><i></i></div><span class="art-link">${svg('link')}</span><span class="art-dot"></span><span class="art-dot second"></span></div></section>`:''}<section class="section"><div class="section-title"><h2>我的工作区<span>围绕一件事，放在一起</span></h2><button class="text-button" data-action="spaces">查看全部 ${svg('arrow')}</button></div><div class="space-grid">${state.spaces.slice(0,3).map(card).join('')||'<div class="empty">新建一个工作区，开始第一件工作。</div>'}</div></section><section class="section"><div class="section-title"><h2>最近的资料</h2><button class="text-button" data-action="resources">全部资料 ${svg('arrow')}</button></div><div class="two-column">${table(visibleResources(),true)}<aside class="guide"><div class="guide-mark">${svg('link')}</div><h3>同一份资料，多种上下文。</h3><p>合同可以属于「客户合作」，<br>也可以放进「季度交付」。<br>不用复制，也不用纠结放哪。</p><hr><div class="step"><span>1</span>选中需要的文件或网页</div><div class="step"><span>2</span>加入正在处理的工作区</div><div class="step"><span>3</span>下次回来，直接继续</div><button class="text-button" data-action="resources">选几份资料试试 ${svg('arrow')}</button></aside></div></section>`}else if(view==='spaces'){html=`<div class="eyebrow">WORK IN CONTEXT</div><div class="page-heading"><div><h1>我的工作区</h1><p>一件工作，一个可以随时回来的地方。</p></div>${btn('新建工作区','new-space','plus','primary')}</div><div class="space-grid">${state.spaces.map(card).join('')||'<div class="empty">还没有工作区，试着新建一个。</div>'}</div>`}else{html=`<div class="eyebrow">${view==='workspace'?'A PLACE FOR THIS WORK':'EVERYTHING, IN PLACE'}</div><div class="page-heading"><div><h1>${esc(view==='workspace'?w.name:'全部资料')}</h1><p>${view==='workspace'?'文件与网页，一起围绕这件工作。':'这是已保存的演示资料，不是电脑中的真实文件。'}</p></div><div class="actions">${view==='workspace'?smallButton('工作区设置','space-settings','dots',w.id):''}${btn(view==='workspace'?'添加资料':'添加网页','add','plus','primary')}</div></div>${view==='workspace'?`<div class="workspace-banner" style="${colorStyle(w)}"><span class="space-icon">${svg('folder')}</span><div><p>${esc(w.note)}</p><span class="tiny-note">${w.ids.length} 份资料 · 文件原地不动 · 可关联多个工作区</span></div></div>`:''}${table(visibleResources())}`};$('#content').innerHTML=html+footer()}
function navigate(next,id){closeDetail(false);closeSearch();$('#search').value='';view=next;current=next==='workspace'?id:null;filter='all';selected.clear();scope='all';if(current){state.last=current;save()}render();window.scrollTo(0,0)}
function closeSearch(){ $('#search-panel').hidden=true;$('#search').setAttribute('aria-expanded','false');searchIndex=-1 }
function renderSearch(){const q=$('#search').value.trim().toLocaleLowerCase();let pool=scope==='current'&&current?state.resources.filter(r=>space(current).ids.includes(r.id)):state.resources;const files=pool.filter(r=>(r.name+' '+(r.path||r.url)).toLocaleLowerCase().includes(q));const spaces=scope==='current'&&current?[space(current)].filter(w=>w.name.toLocaleLowerCase().includes(q)):state.spaces.filter(w=>w.name.toLocaleLowerCase().includes(q));const groups=[['工作区',spaces.map(w=>({type:'workspace',id:w.id,name:w.name,sub:`${w.ids.length} 份资料`,w}))],['文件',files.filter(r=>!isWeb(r)).map(r=>({type:'file',id:r.id,name:r.name,sub:r.missing?'原件不可用':r.path,r}))],['网页',files.filter(isWeb).map(r=>({type:'web',id:r.id,name:r.name,sub:r.url,r}))]];searchItems=[];const body=groups.map(([label,items])=>{if(!items.length)return '';return `<div class="result-heading">${label}</div>${items.slice(0,4).map(item=>{const index=searchItems.length;searchItems.push(item);return `<button class="search-result ${index===searchIndex?'chosen':''}" data-action="search-result" data-id="${index}">${item.w?`<span class="space-icon" style="${colorStyle(item.w)}">${svg('folder')}</span>`:fileIcon(item.r)}<span class="result-copy"><strong>${esc(item.name)}</strong><small>${esc(item.sub)}</small></span>${svg('chevron')}</button>`}).join('')}`}).join('');$('#search-panel').innerHTML=`<div class="search-controls"><span>${q?'搜索结果':'快速取回'} · 演示索引</span><button class="chip ${scope==='all'?'active':''}" data-action="scope" data-id="all">全部资料</button>${current?`<button class="chip ${scope==='current'?'active':''}" data-action="scope" data-id="current">当前工作区</button>`:''}</div>${body||'<div class="empty">没有找到匹配资料<br><span class="tiny-note">试试「发布」「合同」或「Figma」。</span></div>'}<div class="search-hint">↑ ↓ 选择 &nbsp;&nbsp; Enter 查看 &nbsp;&nbsp; Esc 返回当前工作</div>`;$('#search-panel').hidden=false;$('#search').setAttribute('aria-expanded','true')}
function pickSearch(index){const item=searchItems[index];if(!item)return;closeSearch();$('#search').blur();if(item.type==='workspace')navigate('workspace',item.id);else openDetail(item.id)}
function closeDetail(restore=true){$('#detail').hidden=true;$('#scrim').hidden=true;document.body.style.overflow='';detailId=null;if(restore&&returnFocus?.isConnected)returnFocus.focus()}
function openDetail(id){closeSearch();returnFocus=document.activeElement;detailId=id;renderDetail();$('#detail').hidden=false;$('#scrim').hidden=false;document.body.style.overflow='hidden';$('#detail').focus()}
function renderDetail(){const r=resource(detailId);if(!r)return;const related=state.spaces.filter(w=>w.ids.includes(r.id));$('#detail').innerHTML=`<div class="detail-top"><span>资料详情 · 演示</span>${smallButton('关闭详情','close-detail','close')}</div><div class="detail-hero">${fileIcon(r)}<h2>${esc(r.name)}</h2><div class="actions">${btn(r.missing?'重新关联':'模拟打开','open','external','primary',r.id)}${btn('加入工作区','link-one','plus','',r.id)}</div></div><dl><dt>类型</dt><dd>${isWeb(r)?'网页链接':r.kind+' 文件'}</dd><dt>${isWeb(r)?'网址':'原始位置'}</dt><dd>${esc(r.url||r.path)}</dd><dt>修改时间</dt><dd>${esc(r.modified)}</dd>${!isWeb(r)?`<dt>文件大小</dt><dd>${esc(r.size)}</dd><dt>状态</dt><dd>${r.missing?'无法定位演示原件，关联仍然保留':'演示文件 · 未访问真实原件'}</dd>`:''}</dl><div class="section-title"><h3>属于这些工作区</h3><span class="tiny-note">${related.length} 个关联</span></div>${related.map(w=>`<div class="linked-space" style="${colorStyle(w)}"><span class="dot"></span><span>${esc(w.name)}</span>${smallButton('移除此工作区关联','unlink','minus',w.id)}</div>`).join('')||'<p class="muted" style="font-size:11px">尚未加入工作区</p>'}<div class="detail-note">${svg('shield')} ${isWeb(r)?'仅保留网址引用，不抓取页面、不保留登录状态。':'移除关联不会删除文件；关联到多个工作区也不会产生副本。'}<br>原型不会打开任何文件或外部网页。</div>`}
function showDialog(title,body,actionLabel,submit){closeSearch();const d=$('#dialog');d.innerHTML=`<form id="modal-form"><div class="dialog-head"><h2 id="dialog-title">${esc(title)}</h2>${smallButton('关闭弹窗','close-dialog','close')}</div><div class="dialog-body">${body}<div class="form-error" id="form-error" role="status"></div></div><div class="dialog-actions"><button class="button" type="button" data-action="close-dialog">取消</button>${actionLabel?`<button class="button primary" type="submit">${esc(actionLabel)}</button>`:''}</div></form>`;$('#modal-form').addEventListener('submit',event=>{event.preventDefault();submit?.(new FormData(event.target))});if(!d.open)d.showModal()}
function error(message){$('#form-error').textContent=message}
function newSpace(){showDialog('给这件工作起个名字',`<p>把散落在不同位置的文件和网页，关联到同一件工作。原文件不用搬家。</p><label class="field">工作区名称<input name="name" placeholder="例如：春季品牌活动" maxlength="36" required autofocus></label>`,'创建工作区',data=>{const name=data.get('name').trim();if(!name)return error('请填写工作区名称');const id='w-'+crypto.randomUUID();state.spaces.push({id,name,color:'#879f6b',tint:'#eef3e4',note:'与这件工作相关的资料，都可以放在这里。',ids:[]});save();$('#dialog').close();navigate('workspace',id);notify('工作区已创建，添加第一份资料吧')})}
function linkResources(ids){if(!state.spaces.length){notify('先新建一个工作区，再关联资料');return}showDialog('加入工作区',`<p>将 ${ids.length} 份资料加入选中的工作区。不移动原件，也不影响已有的关联。</p>${state.spaces.map(w=>`<label class="check-option" style="${colorStyle(w)}"><span class="dot"></span>${esc(w.name)}<input name="spaces" type="checkbox" value="${w.id}"></label>`).join('')}`,'确认加入',data=>{const targets=data.getAll('spaces');if(!targets.length)return error('请选择至少一个工作区');targets.forEach(id=>{const w=space(id);w.ids=[...new Set([...w.ids,...ids])]});save();selected.clear();$('#dialog').close();render();if(detailId)renderDetail();notify('已关联，原文件保持原位')})}
function add(){if(view==='workspace'){showDialog('添加到这个工作区',`<p>选择已保存的演示资料，或手动添加一个网页。原型不会读取本地文件。</p><div class="actions">${btn('从资料中选择','catalog','folder')}${btn('添加网页链接','add-web','link')}</div>`,'',null)}else addWeb()}
function catalog(){const w=space(current),items=state.resources.filter(r=>!w.ids.includes(r.id));showDialog('选择演示资料',`<p>这是现有的演示资料列表，不是本地文件选择器。</p>${items.map(r=>`<label class="check-option">${fileIcon(r)}<span>${esc(r.name)}</span><input type="checkbox" name="resources" value="${r.id}"></label>`).join('')||'<p>全部演示资料都已在此工作区。</p>'}`,items.length?'加入当前工作区':'',data=>{const ids=data.getAll('resources');if(!ids.length)return error('请选择至少一份资料');w.ids=[...new Set([...w.ids,...ids])];save();$('#dialog').close();render();notify('已加入当前工作区')})}
function addWeb(){showDialog('保存一个网页',`<p>只保存标题和网址，不抓取网页内容。${current?'将同时加入当前工作区。':''}</p><label class="field">网址<input name="url" type="url" placeholder="https://example.com" required autofocus></label><label class="field">标题<input name="name" placeholder="给它一个容易找回的名字" maxlength="80" required></label>`,'保存网页',data=>{const raw=data.get('url').trim(),name=data.get('name').trim();let url;try{url=new URL(raw)}catch{return error('请输入有效的网址')}if(!['https:','http:'].includes(url.protocol))return error('仅支持 http 或 https 网址');if(!name)return error('请填写网页标题');const id='r-'+crypto.randomUUID();state.resources.push({id,name,url:url.href,kind:'WEB',modified:'刚刚保存'});if(current)space(current).ids.push(id);save();$('#dialog').close();filter='all';render();notify('网页已保存，未发起网络访问')})}
function settings(){const w=space(current);showDialog('工作区设置',`<p>删除工作区只移除关联，不删除任何资料。</p><label class="field">工作区名称<input name="name" value="${esc(w.name)}" maxlength="36" required></label><div style="margin-top:23px">${btn('删除此工作区','delete-space','minus','danger',w.id)}</div>`,'保存名称',data=>{const name=data.get('name').trim();if(!name)return error('请填写名称');w.name=name;save();$('#dialog').close();render();notify('工作区已改名')})}
function locations(){showDialog('管理位置 · 概念演示',`<p>正式应用会请求明确的目录授权。此原型未申请权限、未扫描目录，以下均为样例。</p>${[['桌面','桌面 / 内容运营'],['文档','文档 / 品牌活动、客户资料'],['下载','下载 / 设计交付']].map(([name,path])=>`<div class="location-row">${svg('folder')}<span>${name}<small>${path}</small></span><span class="badge">演示范围</span></div>`).join('')}<div class="detail-note">仅演示授权范围的呈现，不提供虚假的扫描进度。重置会清除本版原型的本地演示数据，不影响另一版原型。</div><div style="margin-top:17px">${btn('重置本版演示','reset-confirm','refresh')}</div>`,'',null)}
// 所有动作均局限于浏览器演示状态；“打开”和“定位”不会调用系统能力。
const handlers={home:()=>navigate('home'),spaces:()=>navigate('spaces'),resources:()=>navigate('resources'),workspace:id=>navigate('workspace',id),'new-space':newSpace,detail:openDetail,'close-detail':()=>closeDetail(),'close-dialog':()=>$('#dialog').close(),filter:id=>{filter=id;selected.clear();render()},scope:id=>{scope=id;searchIndex=-1;renderSearch()},'search-result':id=>pickSearch(Number(id)),'clear-selection':()=>{selected.clear();render()},'link-selected':()=>linkResources([...selected]),'link-one':id=>linkResources([id]),'remove-selected':()=>{const w=space(current);w.ids=w.ids.filter(id=>!selected.has(id));selected.clear();save();render();notify('已移除关联，原文件不受影响')},unlink:id=>{space(id).ids=space(id).ids.filter(rid=>rid!==detailId);save();render();renderDetail();notify('已移除此关联，其他工作区不受影响')},open:id=>{const r=resource(id);if(r.missing){notify('演示：请选择原件重新关联。原型不访问真实文件。')}else notify(isWeb(r)?'演示：正式应用会用默认浏览器打开；本次未打开网页。':'演示：正式应用会用默认程序打开原件；本次未访问文件。')},add,catalog,'add-web':addWeb,'space-settings':settings,locations,'delete-space':id=>showDialog('删除这个工作区？',`<p>「${esc(space(id).name)}」的关联将被移除。所有文件、网页及其他工作区均不受影响。</p>`,'确认删除',()=>{state.spaces=state.spaces.filter(w=>w.id!==id);if(state.last===id)state.last=state.spaces[0]?.id||null;save();$('#dialog').close();navigate('spaces');notify('工作区已删除，源文件未受影响')}),'reset-confirm':()=>showDialog('重置本版演示？','<p>将清除原型 B 中新增的工作区、网址和关联，恢复初始样例。原型 A 和真实文件不受影响。</p>','确认重置',()=>{state=structuredClone(seed);save();$('#dialog').close();navigate('home');notify('演示已重置')})};
document.addEventListener('click',event=>{const action=event.target.closest('[data-action]');if(action){handlers[action.dataset.action]?.(action.dataset.id)}else if(!event.target.closest('#search-wrap'))closeSearch()});
document.addEventListener('change',event=>{if(event.target.matches('[data-select]')){const id=event.target.dataset.select;event.target.checked?selected.add(id):selected.delete(id);render()}else if(event.target.id==='select-all'){const ids=visibleResources().filter(r=>filter==='all'||(filter==='file'?!isWeb(r):isWeb(r))).map(r=>r.id);ids.forEach(id=>event.target.checked?selected.add(id):selected.delete(id));render()}});
$('#search-symbol').innerHTML=svg('search');$('#shortcut').textContent=/Mac|iPhone|iPad/.test(navigator.platform)?'⌘ K':'Ctrl K';
$('#search').addEventListener('focus',()=>{searchIndex=-1;renderSearch()});$('#search').addEventListener('input',()=>{searchIndex=-1;renderSearch()});
$('#search').addEventListener('keydown',event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();const n=searchItems.length;if(n){searchIndex=(searchIndex+(event.key==='ArrowDown'?1:-1)+n)%n;renderSearch();$('#search-panel .chosen')?.scrollIntoView({block:'nearest'})}}else if(event.key==='Enter'){event.preventDefault();pickSearch(searchIndex<0?0:searchIndex)}else if(event.key==='Escape'){event.stopPropagation();closeSearch();$('#search').blur()}});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){if($('#dialog').open||detailId)return;event.preventDefault();$('#search').focus();$('#search').select()}if(event.key==='Escape'&&!$('#dialog').open){closeDetail();closeSearch()}
// 侧面详情为模态区域，约束焦点，防止键盘操作落到背后的工作区。
if(event.key==='Tab'&&detailId&&!$('#dialog').open){const controls=[...$('#detail').querySelectorAll('button,[href],input,[tabindex="0"]')];const first=controls[0],last=controls.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===$('#detail'))){event.preventDefault();last?.focus()}else if(!event.shiftKey&&(document.activeElement===last||document.activeElement===$('#detail'))){event.preventDefault();first?.focus()}}});
render();
</script>
</body>
</html>
